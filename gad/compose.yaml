services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gad
      POSTGRES_USER: gad
      POSTGRES_PASSWORD: gad_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gad", "-d", "gad"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gad_pgdata: